artifacts:
  proposal:
    description: Initial proposal document outlining the change
    output: proposal.md
    plan:
      template: proposal.md
      review: true
      instruction: |
        Create the proposal document that establishes why this change is needed and what it covers. Keep it concise.

        Existing domains (for context):
        {{DOMAINS}}

        Sections:
        - **Why**: 1-2 sentences on the problem or opportunity
        - **What Changes**: Capabilities added, changed or removed. Mark breaking changes with **BREAKING**
        - **Domains**: The domains whose requirements this change creates or modifies:
          - **New Domains**: Domains not yet defined that this change introduces. Use kebab-case names.
          - **Modified Domains**: Existing domains whose requirements change. Implementation-only changes leave a domain unmodified.
          - Remove either subsection if not applicable
        - **Impact**: Systems, external contracts and their consumers that this change affects
        - **Open Questions**: Unresolved decisions that need user input during review (omit section if none)
  specs:
    description: Detailed specifications for the change
    output: specs/{domain}.md
    plan:
      template: spec.md
      instruction: |
        Create one spec file for each domain listed in the preceding artifact's `Domains` section. The spec file defines WHAT the system should do.

        Existing domains (for context):
        {{DOMAINS}}

        Specify required outcomes and boundary constraints. Include a statement only if changing it would change what actors (people or external systems) can rely on: external contracts such as endpoints, payload fields and error codes belong here. Keep presentation details (exact labels, layout order, help-text wording), implementation mechanisms (internal helpers, query strategy, class structure) and test or release procedures out of specs; record any that matter in design.

        For each domain:
        - **New Domains**: use the exact kebab-case name from the proposal. In the frontmatter description field, write the initial description of the domain's responsibility.
        - **Modified Domains**: use the existing domain name when creating the delta domain spec. In the frontmatter description field, write the current domain's description, or update it if the domain's scope has changed. Include ONLY requirements that are actually changing — do not restate the full domain.

        Delta operations (use ## headers):
        - **ADDED Requirements**: New requirements for this domain
        - **MODIFIED Requirements**: Changed behavior — MUST include full updated content
        - **RENAMED Requirements**: Name changes only — list pairs as `- FROM: \`old-name\` TO: \`new-name\`` (one pair per bullet)
        - **REMOVED Requirements**: Deprecated features — MUST include **Reason** and **Migration**

        Format requirements:
        - Each requirement: `### Requirement: <name>` followed by description
          - Use SHALL/MUST for normative requirements (avoid should/may)
        - Each scenario: `#### Scenario: <name>` with GIVEN/WHEN/THEN format
          - **GIVEN** preconditions and initial state (omit if none)
          - **WHEN** the triggering action or event
          - **THEN** the expected outcome
          - Use **AND** to chain multiple conditions within any step
          - Each scenario is a potential test case — make conditions concrete and verifiable
        - Every requirement MUST have at least one concrete scenario. Add a scenario per distinct outcome, not per trigger; scenarios are representative acceptance cases, not a test inventory.
        - When renaming and modifying the same requirement, list the rename under RENAMED and use the new name for the full updated requirement under MODIFIED.

        MODIFIED requirements workflow:
        1. Locate the existing requirement in the domain spec file
        2. Copy the ENTIRE requirement block (from `### Requirement:` through all scenarios)
        3. Paste under `## MODIFIED Requirements` and edit to reflect new behavior
        4. Ensure header text matches exactly (whitespace-insensitive), using the new name when the delta also renames the requirement
    archive:
      instruction: |
        Merge delta domain specs into the accumulated domain spec files.

        Existing domains (for context):
        {{DOMAINS}}

        Delta domain specs:
        {{DELTAS}}

        For each delta domain spec file, read the corresponding domain spec file (if it exists) and apply changes:

        Apply operations in this order:
        - **RENAMED Requirements**: Find by the FROM: name and update the header to the TO: name before applying modifications.
        - **MODIFIED Requirements**: Find the matching requirement in the domain spec by header text (whitespace-insensitive), using the new name if it was renamed, and replace it entirely. If not found, treat as ADDED.
        - **ADDED Requirements**: Append under a `## Requirements` section in the domain spec.
        - **REMOVED Requirements**: Find and remove the matching requirement from the domain spec. If not found, skip silently.

        If the domain spec file doesn't exist yet, create it with the ADDED requirements.
    document:
      template: domain.md
      instruction: |
        Given the explored files, compile an accumulated domain spec based on the domain name and resolved description.

        Specify supported outcomes and boundary constraints. Include a statement only if changing it would change what actors (people or external systems) can rely on: external contracts such as endpoints, payload fields and error codes belong here. Keep presentation details (exact labels, layout order, help-text wording), implementation mechanisms (internal helpers, query strategy, class structure) and verification procedures out of specs. Do not turn unverified external facts into requirements.

        Format requirements:
        - Each requirement: `### Requirement: <name>` followed by description
          - Use SHALL/MUST for normative requirements (avoid should/may)
        - Each scenario: `#### Scenario: <name>` with GIVEN/WHEN/THEN format
          - **GIVEN** preconditions and initial state (omit if none)
          - **WHEN** the triggering action or event
          - **THEN** the expected outcome
          - Use **AND** to chain multiple conditions within any step
          - Each scenario is a potential test case — make conditions concrete and verifiable
        - Every requirement MUST have at least one concrete scenario. Add a scenario per distinct outcome, not per trigger; scenarios are representative acceptance cases, not a test inventory.

        If a spec file already exists at the output path, treat its requirements as the authoritative baseline. For each existing requirement:
          - If code within the scope supports it, keep and optionally refine wording
          - If code within the scope contradicts it, report to the user
          - If the scope is silent on it, report to the user. Silence does not imply the requirement is invalid
          - Then add any new requirements for behaviors found within the scope that aren't covered by existing requirements
  design:
    description: Technical approach and decisions for the change
    output: design.md
    plan:
      template: design.md
      review: true
      instruction: |
        Create the design document that explains how to implement the change. If the change is straightforward, keep design content minimal.

        Sections:
        - **Context**: Background, current state of the code the change touches, constraints
        - **Goals / Non-Goals**: What this design achieves and explicitly excludes
        - **Decisions**: Current technical choices with rationale (why X over Y?) and alternatives that explain them
        - **Risks / Trade-offs**: Known limitations, what could go wrong. Format: [Risk] → Mitigation
        - **Open Questions**: Unresolved decisions that need user input during review (omit section if none)

        Focus on architecture and the reasons behind decisions, not line-by-line implementation.
  tasks:
    description: Implementation checklist with trackable tasks
    output: tasks.md
    plan:
      template: tasks.md
      instruction: |
        Create implementation tasks from the dependencies. Do not introduce scope, behavior or architecture.

        Guidelines:
        - Structure task groups as vertical slices, not horizontal layers (all database changes, then all services, then all controllers):
          - Each group should produce an end-to-end checkpoint, tested within the group
          - Groups should be small enough to complete and validate in one focused session

        Use exactly this format:
        - Include only `## N. Group title` headings, `- [ ] N.M Task description` lines, and blank lines
        - Number groups consecutively from 1. Within each group N, number tasks N.1, N.2, and so on
        - After inserting, removing, or reordering groups or tasks, renumber them and update any affected references
    apply:
      instruction: |
        Assigned Task Group:
        {{TASK_GROUP}}

        Complete the tasks in this group in order, marking each checkbox `- [x]` when it is done. In the task list, change only checkbox states.

        Keep implementation changes minimal and focused on the assigned tasks. Where existing code in this group's scope differs from the agreed target, bring it into line and remove code superseded by that target. Preserve unrelated work.

        Before stopping, check the code for the answer. Stop if a requirement remains unclear, requirements conflict, a missing prerequisite blocks progress, or the plan needs to change.

        End with a report: what you did, verification results, remaining tasks, and, if you stopped, the evidence and the decision, prerequisite, or plan change needed.

workflows:
  spec-global:
    description: Proposal, specs, design and tasks. At archive, delta specs merge into the domain specs, which persist across changes.
    plan: [proposal, specs, design, tasks]
    apply: [tasks]
    archive: [specs]
    document: specs
  spec-local:
    description: Proposal, specs, design and tasks. Specs serve the current change only and stay with it in the archive.
    plan: [proposal, specs, design, tasks]
    apply: [tasks]

workflow: spec-global
